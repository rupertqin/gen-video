<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=1080, height=1920">
  <title>主页</title>
  <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
  <style>
    @font-face { font-family: "PingFang SC"; src: local("PingFang SC"), local("PingFangSC-Regular"), local("Hiragino Sans GB"); }
    @font-face { font-family: "Songti SC"; src: local("Songti SC"), local("STSong"), local("Songti"); }

    :root {
      /* ---------------- 中性色：冷调纸白 ----------------
         原来 #F6F3EC 是黄调米色（色相 ≈43°），配上暖黑 #2A2620 和陶土色 --accent-2，
         三个暖色叠在一起就发「土」。现在把整条中性色阶挪到冷调（色相 ≈200°），
         和品牌绿 --accent 同属冷侧；画面里唯一的暖色留给照片本身（粉衬衫 / 肤色）。
         --bg-rgb 是底色的唯一来源：html/body、#root、照片下沿渐隐都用它，
         以后换底色只改这一行。 */
      --bg-rgb: 237, 242, 244;    /* #EDF2F4 冷调纸白 */
      --bg: rgb(var(--bg-rgb));
      --ink: #1E2528;             /* 冷调近黑：与底色同色相，不再用暖黑 */
      --ink-dim: #55636A;
      --ink-faint: #7C8A90;
      --panel: #FAFCFC;           /* 不用纯白，向底色靠一点 */
      --accent: #5E8C7A;          /* 品牌绿：角标 / 字幕强调字，不动 */
      --accent-ink: #35604E;
      --accent-2: #BC6F3C;
      --line: rgba(30, 37, 40, 0.14);

      /* 安全线（兜底默认值）：构建时会被 config 生成的那一段覆写 —— 值来自 caption.config.json 的
         stage.leftPadding / rightPadding，与字幕共用同一组数字。改配置请改那个文件，不要动这里。 */
      --gutter: 180px;
      --gutter-right: 180px;
      /* 下面这几个是兜底默认值：构建时会被根目录 config.json 生成的那一段覆写。
         所以平时改配置请改 config.json，再跑 npm run build-config，不要直接动这里。 */
      --title: "";          /* 背景标题文字（config.json: title） */
      --hero-fit: cover;    /* 背景图铺法（两档都用 cover，档位定义见 scripts/build-config.mjs） */
      --hero-h: 720px;      /* 照片区高度（config.json: heroFit） */
      --hero-top: 482px;    /* 照片区顶边 */
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { width: 1080px; height: 1920px; overflow: hidden; background: var(--bg); }
    #root { position: relative; width: 1080px; height: 1920px; overflow: hidden; background: var(--bg); }

    /* ---------------- 常驻背景（浅色纸感） ---------------- */
    #bg { position: absolute; inset: 0; z-index: 0; }

    /* 主视觉：bg1.webp（原图 960×640）。铺法 / 高度 / 顶边三个值都由 --hero-* 控制，
       档位定义见 :root 的「两种铺法」。底边 + 下沿渐隐完成「照片 → 纸 → 字幕」的分区过渡。 */
    .bg-hero {
      position: absolute; left: 0; top: var(--hero-top); width: 1080px; height: var(--hero-h);
      background-image: url("assets/bg/bg1.webp");
      background-size: var(--hero-fit);
      background-repeat: no-repeat;
      background-position: center top;
    }
    .bg-hero::after {
      content: ""; position: absolute; inset: 0;
      /* 渐隐落点直接取 --bg-rgb，换底色不会在这里留一条色差 */
      background: linear-gradient(180deg,
        rgba(var(--bg-rgb), 0) 0%,
        rgba(var(--bg-rgb), 0) 46%,
        rgba(var(--bg-rgb), 0.40) 64%,
        rgba(var(--bg-rgb), 0.84) 82%,
        rgb(var(--bg-rgb)) 100%);
    }
    .bg-grid {
      position: absolute; inset: 0;
      background-image:
        linear-gradient(rgba(30,37,40,0.05) 1px, transparent 1px),
        linear-gradient(90deg, rgba(30,37,40,0.05) 1px, transparent 1px);
      background-size: 80px 80px;
    }
    .bg-title {
      /* 水平居中：left/right 撑满 + width:fit-content + margin auto。
         不能用 translateX(-50%) —— GSAP 会往这个元素写 transform（环境位移），会把它顶掉 */
      position: absolute; left: 0; right: 0; width: fit-content;
      margin-left: auto; margin-right: auto;
      /* 贴在照片区底边上方 122px（≈ 标题自身高度），两种铺法自动跟随：
         width 档 → 1080，height 档 → 1030。始终落在照片溶尽后的纸面上 */
      top: calc(var(--hero-top) + var(--hero-h) - 122px);
      font-family: "Songti SC", serif; font-weight: 900;
      font-size: 340px; line-height: 1; letter-spacing: -0.04em; white-space: nowrap;
      /* 标题：跟着新的冷调中性色走（旧的暖黑 42,38,32 配冷底会发脏）。
         38% 的冷墨是「清楚的灰」，不抢照片；想更抢眼可以换成品牌绿 --accent-ink */
      color: rgba(30, 37, 40, 0.38);
    }
    /* 文字来自 config.json 的 title（构建时写成 --title，带引号的 CSS 字符串）。
       留空时 content 不产出内容，整块自然消失 */
    .bg-title::before { content: var(--title); }
    .bg-marks { position: absolute; inset: 40px; }
    .bg-marks::before, .bg-marks::after {
      content: ""; position: absolute; width: 24px; height: 24px; border-color: rgba(94,140,122,0.45);
    }
    .bg-marks::before { left: 0; top: 0; border-left: 2px solid; border-top: 2px solid; }
    .bg-marks::after { right: 0; bottom: 0; border-right: 2px solid; border-bottom: 2px solid; }
    /* ---------------- 场景骨架 ---------------- */
    .scene { position: absolute; inset: 0; z-index: 1; }
    .scene-inner { position: absolute; inset: 0; padding: 600px 76px 230px; display: flex; flex-direction: column; }
    .scene-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 28px; }
    .scene-tag { font-family: "JetBrains Mono", "PingFang SC", monospace; font-size: 18px; letter-spacing: 0.22em; color: var(--accent-ink); }
    .scene-tag::before {
      content: ""; display: inline-block; width: 26px; height: 2px; background: var(--accent);
      vertical-align: middle; margin-right: 14px;
    }
    .scene-index { font-family: "JetBrains Mono", "PingFang SC", monospace; font-size: 18px; letter-spacing: 0.1em; color: var(--ink-dim); }
    .scene-index b { color: var(--ink); font-weight: 700; }
    .scene-title {
      font-family: "Songti SC", serif; font-weight: 900; font-size: 62px; line-height: 1.3;
      color: var(--ink); letter-spacing: -0.01em;
    }
    .rule { width: 88px; height: 3px; background: var(--accent); margin-top: 28px; }
    .scene-body { margin-top: 46px; flex: 1; min-height: 0; display: flex; flex-direction: column; justify-content: center; }

    /* ---------------- 内容样式 ---------------- */
    .lead { font-family: "PingFang SC", sans-serif; font-size: 29px; line-height: 1.72; color: var(--ink-dim); }
    .lead strong { color: var(--ink); font-weight: 700; }
    .lead .hl { color: var(--accent-ink); font-weight: 700; }

    .def-list { display: flex; flex-direction: column; }
    .def { padding: 17px 0; border-bottom: 1px solid var(--line); }
    .def:last-child { border-bottom: none; }
    .def-term { font-family: "Songti SC", serif; font-weight: 700; font-size: 34px; color: var(--accent-ink); margin-bottom: 5px; }
    .def-desc { font-family: "PingFang SC", sans-serif; font-size: 26px; line-height: 1.6; color: var(--ink); }
    .def-desc .dim { color: var(--ink-dim); }

    .cols, .panels, .pair { display: grid; grid-template-columns: 1fr; gap: 20px; }
    .col, .panel, .pair-box { padding: 30px 32px; border-radius: 4px; border: 1px solid var(--line); background: var(--panel); }
    .panel.b { background: rgba(94,140,122,0.09); border-color: rgba(94,140,122,0.42); }
    .pair-box.b { background: rgba(188,111,60,0.07); border-color: rgba(188,111,60,0.35); }
    .col-label, .panel-label, .pair-label {
      font-family: "JetBrains Mono", "PingFang SC", monospace; font-size: 18px; letter-spacing: 0.12em;
      color: var(--ink-dim); margin-bottom: 16px;
    }
    .panel.b .panel-label { color: var(--accent-ink); }
    .col-terms { font-family: "Songti SC", serif; font-weight: 700; font-size: 32px; line-height: 1.5; color: var(--ink); }
    .col-terms .sep { color: var(--accent); }
    .panel-text { font-family: "Songti SC", serif; font-weight: 700; font-size: 30px; line-height: 1.55; color: var(--ink); }
    .panel.a .panel-text { color: var(--ink-dim); }
    .pair-text { font-family: "PingFang SC", sans-serif; font-size: 27px; line-height: 1.6; color: var(--ink); }

    .note { margin-top: 28px; font-family: "PingFang SC", sans-serif; font-size: 26px; line-height: 1.65; color: var(--ink-dim); }
    .note .hl { color: var(--accent-ink); font-weight: 700; }
    .note .dim { color: var(--ink-faint); }
    .note strong { color: var(--ink); font-weight: 700; }

    .q-list { display: flex; flex-direction: column; gap: 22px; }
    .q { display: flex; align-items: baseline; gap: 16px; font-family: "PingFang SC", sans-serif; font-size: 27px; line-height: 1.55; color: var(--ink); }
    .q .mark { font-family: "JetBrains Mono", "PingFang SC", monospace; font-size: 19px; color: var(--accent); min-width: 38px; }
    .q .dim { color: var(--ink-dim); }

    .chain { display: flex; flex-direction: column; gap: 16px; }
    .chain-row { display: flex; flex-direction: column; gap: 2px; font-family: "PingFang SC", sans-serif; font-size: 28px; color: var(--ink); }
    .chain-row .dim { color: var(--ink-dim); font-size: 25px; }

    .quote {
      font-family: "Songti SC", serif; font-weight: 700; font-size: 42px; line-height: 1.5; color: var(--ink);
      padding-left: 28px; border-left: 4px solid var(--accent);
    }
    .quote .src { display: block; font-family: "JetBrains Mono", "PingFang SC", monospace; font-weight: 400; font-size: 18px; letter-spacing: 0.08em; color: var(--ink-dim); margin-top: 16px; }

    .sac { display: flex; flex-direction: column; gap: 14px; }
    .sac-row { font-family: "PingFang SC", sans-serif; font-size: 28px; line-height: 1.55; color: var(--ink); }
    .sac-row .t { color: var(--accent-2); font-weight: 700; }
    .sac-concl { margin-top: 30px; font-family: "Songti SC", serif; font-weight: 700; font-size: 32px; line-height: 1.5; color: var(--ink); }
    .sac-concl .hl { color: var(--accent-ink); }

    .final { font-family: "Songti SC", serif; font-weight: 700; font-size: 32px; line-height: 1.55; color: var(--ink); }
    .final .hl { color: var(--accent-ink); }
  </style>

  <!-- __HF_CONFIG_START__ -->
  <style>
    /* 自动生成：来自根目录 config.json + caption.config.json，请勿手改。改配置后运行 npm run build-config */
    :root {
      /* 安全线：与字幕共用同一组数字，来源 caption.config.json 的 stage.leftPadding / rightPadding。
         标题、页脚用它；照片是全幅通栏，不受影响 */
      --gutter: 180px;
      --gutter-right: 180px;
      --title: "蔡康永的心理分析";
      --hero-fit: cover;
      /* width 档的框比例恰好等于原图比例 → cover 等于整幅不裁切；
         height 档的框更瘦 → cover 自动变成「按高度铺 + 左右裁掉」 */
      --hero-h: 1152px;
      --hero-top: 0px;
    }
  </style>
  <!-- __HF_CONFIG_END__ -->
</head>
<body>
  <div data-hf-id="hf-xrp1" id="root" data-composition-id="main" data-width="1080" data-height="1920" data-start="0" data-duration="1645">

    <!-- ========== 常驻背景 ========== -->
    <div style="z-index: 1" data-hf-id="hf-5qeh" id="bg" data-layout-ignore="" data-start="0" data-track-index="0">
      <div data-hf-id="hf-hero" class="bg-hero"></div>
      <div data-hf-id="hf-yqqm" class="bg-grid"></div>
      <div data-hf-id="hf-ui8a" class="bg-title" data-layout-ignore="" data-start="0" data-track-index="6"></div>
      <div data-hf-id="hf-t7d4" class="bg-marks"></div>
    </div>

    <!-- 播放源用压缩版 audio.m4a（15MB），不是母版 audio.wav（111MB）。
         框架运行时会强制 audio.preload="auto"，也就是抢着把整个文件读完并等它就绪；
         111MB 时这一步要 ~50s，预览要等就绪才切成 9:16，于是长时间停在横屏。
         15MB 时这一步降到秒级。母版 wav 仍留在 assets/audio/ 里做时长基准与再生成来源，
         由 scripts/make-preview-audio.sh 生成 m4a（时长一致：1161.52s）。 -->
    <audio data-hf-id="hf-bqim" id="voice" src="assets/audio/audio.m4a" data-start="0" data-duration="1644.04" data-track-index="10"></audio>

    <div data-hf-id="hf-3b7k" id="captions" class="clip caption-host" data-composition-id="captions" data-composition-src="compositions/captions.html" data-start="0" data-duration="1644.04" data-track-index="5" data-track-kind="captions" data-width="1080" data-height="1920" data-layout-ignore></div>



  </div>

  <script>
    window.__timelines = window.__timelines || {};
    var tl = gsap.timeline({ paused: true });

    /* ---- 背景动画：目前没有 ----
       已移除：径向光晕 .bg-wash1/2（元素连同动画一起删）、标题的 ±30px 纵向漂移、
       页脚淡入 .bg-foot（元素已删）。
       背景现在是完全静止的：照片 + 网格 + 标题 + 角标。
       时间轴仍然注册（框架要求 window.__timelines 里有对应条目），只是没有子项。 */

    window.__timelines["main"] = tl;

    /* ---- 背景标题自适应 ----
       .bg-title 是水平居中的单行不换行文字；文字一多就左右溢出，被 #root 的
       overflow:hidden 裁掉（例如 7 个字在 340px 下宽 2611px，画幅只有 1080px）。
       所以这里量一次真实宽度，超宽就等比缩小字号，保证整行留在画幅内。 */
    (function () {
      var title = document.querySelector(".bg-title");
      if (!title) return;
      var BASE = 340;              // 基准字号：放得下就用它
      var SIDE_GAP = 40;           // 在安全线之外再留的余量，让居中的标题不贴边
      function fit() {
        var root = document.getElementById("root") || document.documentElement;
        // 可用宽度 = 画幅 − 左边距 − 右边距 − 两侧余量（左右不对称，与平台安全区一致）
        var cs = getComputedStyle(root);
        var g = parseInt(cs.getPropertyValue("--gutter"), 10) || 0;
        var gr = parseInt(cs.getPropertyValue("--gutter-right"), 10) || g;
        var maxW = (root.clientWidth || 1080) - g - gr - SIDE_GAP * 2;
        title.style.fontSize = BASE + "px";
        var w = title.getBoundingClientRect().width;
        if (w > maxW) title.style.fontSize = Math.floor((BASE * maxW) / w) + "px";
      }
      fit();
      // 字体度量会影响宽度：字体就绪后再量一次
      if (document.fonts && document.fonts.ready) document.fonts.ready.then(fit);
    })();
  </script>
</body>
</html>
